# The CI of this fork, on demand.
#
# Chatwoot consumes the fork by git ref, on the Ruby and Rails it runs, so that
# is the one combination tested here: no matrix across versions nobody uses,
# and no release job -- the gem is never published from this fork.
#
# Run it from "Run workflow" (`workflow_dispatch`) before tagging a version.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: ./.github/workflows/_gitleaks.yml

  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      ruby-version: "3.4"
      bundler-cache: true

  test:
    name: Test (3.4 / rails-7.1)
    needs: [gitleaks, lint]
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
      SKIP_COVERAGE: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle install
          bundle exec appraisal rails-7.1 bundle install

      - name: Run eager-load guard
        run: bundle exec appraisal rails-7.1 ruby -e "require 'ruby_llm'; Zeitwerk::Loader.eager_load_all"

      - name: Run tests
        run: bundle exec appraisal rails-7.1 bin/rspec-queue
        env:
          SPEC_OPTS: --tag ~generator
